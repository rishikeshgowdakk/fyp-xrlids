[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrlids"
version = "0.1.0"
description = "XRL-IDARS v1 - Explainable RL-Based Intrusion Detection and Autonomous Response System (Phase 1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Dependencies are pinned in requirements.txt for reproducibility (see REPRODUCIBILITY.md).
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "PyYAML==6.0.3",
    "joblib==1.6.0",
    "torch==2.14.0",
    "shap==0.52.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
xrlids = "xrlids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
