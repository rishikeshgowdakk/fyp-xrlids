# Feature Registry - XRL-IDARS v1
#
# STATUS: candidate_not_frozen. Blocked from freezing by D-002 (feature contract).
#
# RULES (build spec sections 8-10):
#   - Every canonical feature has a mathematical definition (docs/phase1/FEATURE_DEFINITIONS.md).
#   - Formulas live in Python (src/xrlids/features/definitions.py) as the single source of
#     truth; this file holds rung membership, gate answers and per-dataset column maps.
#   - R10/R15/R20 are CANDIDATES. They are not final until the decision gate is resolved
#     with evidence (feature sweep + validation).
#   - Identifiers (IP, port, flow id, timestamp) are NEVER model features.

registry_version: "0.2.0"
last_updated: "2026-09-30"
contract_status: candidate_not_frozen
frozen_by_decision: D-002

# ---------------------------------------------------------------------------
# Rungs - candidate membership, ordered. Order is part of the schema identity.
# ---------------------------------------------------------------------------
rungs:
  R10:
    description: "Live-reproducible behavioural core (the project's stated 10-feature baseline)."
    live_compatible: true
    features:
      - flow_duration_ms
      - flow_packets_per_s
      - flow_bytes_per_s
      - packet_length_mean
      - packet_length_std
      - syn_count
      - ack_count
      - rst_count
      - fin_count
      - syn_ack_ratio
  R15:
    description: "R10 plus inter-arrival timing and directional packet-size structure."
    live_compatible: true
    features:
      - flow_duration_ms
      - flow_packets_per_s
      - flow_bytes_per_s
      - packet_length_mean
      - packet_length_std
      - syn_count
      - ack_count
      - rst_count
      - fin_count
      - syn_ack_ratio
      - flow_iat_mean_ms
      - flow_iat_std_ms
      - down_up_ratio
      - fwd_packet_length_mean
      - bwd_packet_length_mean
  R20:
    description: "R15 plus flow-activity structure and subflow volume (research-heavier features)."
    live_compatible: false
    features:
      - flow_duration_ms
      - flow_packets_per_s
      - flow_bytes_per_s
      - packet_length_mean
      - packet_length_std
      - syn_count
      - ack_count
      - rst_count
      - fin_count
      - syn_ack_ratio
      - flow_iat_mean_ms
      - flow_iat_std_ms
      - down_up_ratio
      - fwd_packet_length_mean
      - bwd_packet_length_mean
      - flow_bytes_per_packet
      - active_mean_ms
      - idle_mean_ms
      - subflow_fwd_bytes
      - subflow_bwd_bytes

# ---------------------------------------------------------------------------
# Feature selection decision gate (section 9). Short codes:
#   yes | no | partial | unverified (needs the audit / feature sweep)
# ---------------------------------------------------------------------------
gate:
  flow_duration_ms:    {Q1_live: yes, Q2_cross_dataset: yes, Q3_identity_leak: no,  Q4_target_leak: no, Q5_metadata: no,  Q6_unit: yes, Q7_improves: unverified, Q8_hurts_cross: unverified, Q9_cost: no,  Q10_justify: yes}
