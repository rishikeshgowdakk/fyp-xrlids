# ---------------------------------------------------------------------------
# Per-dataset column maps: raw column -> semantic field.
# Entry forms:
#   {column: NAME, scale: NUMBER}                 -> semantic = column * scale
#   {sum: [A,B], divide_by_sum: [C,D]}            -> semantic = (A+B)/(C+D)
# STATUS unverified_pending_audit: confirmed by 01_dataset_audit.py, not assumed.
# ---------------------------------------------------------------------------
column_maps_status: unverified_pending_audit
column_maps:

  cicids2017:
    duration_seconds:        {column: " Flow Duration", scale: 0.000001}
    total_fwd_packets:       {column: " Total Fwd Packets"}
    total_bwd_packets:       {column: " Total Backward Packets"}
    fwd_bytes:               {column: "Total Length of Fwd Packets"}
    bwd_bytes:               {column: " Total Length of Bwd Packets"}
    pkt_len_mean:            {column: " Packet Length Mean"}
    pkt_len_std:             {column: " Packet Length Std"}
    syn_flags:               {column: " SYN Flag Count"}
    ack_flags:               {column: " ACK Flag Count"}
    rst_flags:               {column: " RST Flag Count"}
    fin_flags:               {column: "FIN Flag Count"}
    flow_iat_mean_s:         {column: " Flow IAT Mean", scale: 0.000001}
    flow_iat_std_s:          {column: " Flow IAT Std", scale: 0.000001}
    fwd_pkt_len_mean:        {column: " Fwd Packet Length Mean"}
    bwd_pkt_len_mean:        {column: " Bwd Packet Length Mean"}
    active_mean_s:           {column: "Active Mean", scale: 0.000001}
    idle_mean_s:             {column: "Idle Mean", scale: 0.000001}
    subflow_fwd_bytes:       {column: " Subflow Fwd Bytes"}
    subflow_bwd_bytes:       {column: " Subflow Bwd Bytes"}

  cse_cic_ids2018:
    duration_seconds:        {column: "Flow Duration", scale: 0.000001}
    total_fwd_packets:       {column: "Tot Fwd Pkts"}
    total_bwd_packets:       {column: "Tot Bwd Pkts"}
    fwd_bytes:               {column: "TotLen Fwd Pkts"}
    bwd_bytes:               {column: "TotLen Bwd Pkts"}
    pkt_len_mean:            {column: "Pkt Len Mean"}
    pkt_len_std:             {column: "Pkt Len Std"}
    syn_flags:               {column: "SYN Flag Cnt"}
    ack_flags:               {column: "ACK Flag Cnt"}
    rst_flags:               {column: "RST Flag Cnt"}
    fin_flags:               {column: "FIN Flag Cnt"}
    flow_iat_mean_s:         {column: "Flow IAT Mean", scale: 0.000001}
    flow_iat_std_s:          {column: "Flow IAT Std", scale: 0.000001}
    fwd_pkt_len_mean:        {column: "Fwd Pkt Len Mean"}
    bwd_pkt_len_mean:        {column: "Bwd Pkt Len Mean"}
    active_mean_s:           {column: "Active Mean", scale: 0.000001}
    idle_mean_s:             {column: "Idle Mean", scale: 0.000001}
    subflow_fwd_bytes:       {column: "Subflow Fwd Byts"}
    subflow_bwd_bytes:       {column: "Subflow Bwd Byts"}

  unsw_nb15:
    duration_seconds:        {column: "dur"}
    total_fwd_packets:       {column: "spkts"}
    total_bwd_packets:       {column: "dpkts"}
    fwd_bytes:               {column: "sbytes"}
    bwd_bytes:               {column: "dbytes"}
    pkt_len_mean:            {sum: ["sbytes", "dbytes"], divide_by_sum: ["spkts", "dpkts"]}
    # UNSW-NB15 has no per-flag counts, no IAT, no active/idle, no subflow fields.
    # These are intentionally absent rather than guessed. See FEATURE_COMPATIBILITY.md.

# ---------------------------------------------------------------------------
# Excluded columns (never model inputs)
# ---------------------------------------------------------------------------
excluded_column_patterns:
  - "^(flow )?id$"
  - "timestamp"
  - "src[_ ]?ip"
  - "dst[_ ]?ip"
  - "source[_ ]?ip"
  - "destination[_ ]?ip"
  - "src[_ ]?port"
  - "dst[_ ]?port"
  - "source[_ ]?port"
  - "destination[_ ]?port"
  - "attack_cat"
  - "^label$"
exclusion_reason: >
  Identifiers and labels are not behavioural features. They leak dataset identity
  (Q3) or target information (Q4) and may only be used for grouping, leakage analysis
  and provenance.
