# Label Contract - XRL-IDARS v1
#
# RULES (build spec sections 7 and 14; scientific RULE 3):
#   - Binary target: BENIGN/NORMAL -> 0, ATTACK -> 1.
#   - Native and canonical labels are PRESERVED as separate columns.
#   - Unknown labels are REJECTED and counted. They are NEVER silently mapped to BENIGN.
#   - Known attack labels are an explicit ALLOW-LIST per dataset. Anything not in the
#     allow-list and not benign is UNKNOWN -> rejected.
#
# STATUS: unverified_pending_audit
#   The label sets below are documented from public dataset descriptions. They MUST be
#   confirmed against the real files by scripts/phase1/01_dataset_audit.py before the
#   contract is frozen. The audit reports unknown labels, so a wrong entry here fails
#   loudly rather than silently mislabelling data.

contract_version: "0.2.0"
last_updated: "2026-09-30"
status: unverified_pending_audit      # unverified_pending_audit | frozen

binary:
  positive_class: 1        # ATTACK
  negative_class: 0        # BENIGN
  benign_tokens:           # compared after normalization
    - BENIGN
    - NORMAL
  unknown_label_policy: REJECT

normalization:
  strip: true
  collapse_internal_whitespace: true
  case: upper
  # Encoding artifacts frequently seen in CICIDS2017 labels.
  unicode_replacements:
    "\u2013": "-"          # en dash -> hyphen
    "\u2014": "-"          # em dash -> hyphen
    "\ufffd": "-"          # unicode replacement char -> hyphen
    "": "-"               # mojibake byte replacement -> hyphen
    "\u2019": "'"
  # Trailing/leading punctuation seen in some exported label columns.
  strip_characters: " \t\r\n\u00a0"

attack_families:
  - DoS
  - DDoS
  - PortScan
  - Web
  - BruteForce
  - Bot
  - Reconnaissance
  - Infiltration
  - Analysis
  - Backdoor
  - Exploits
  - Fuzzers
  - Shellcode
  - Worms
  - Generic
  - Heartbleed
  - Other

# ---------------------------------------------------------------------------
# Per-dataset taxonomy. Keys are NORMALIZED known attack labels.
# ---------------------------------------------------------------------------
datasets:

  cicids2017:
    label_column_candidates: [" Label", "Label", "Label "]   # audit confirms the real one
    benign_labels: ["BENIGN"]
    family_map:
      "DOS HULK": DoS
      "DOS GOLDENEYE": DoS
      "DOS SLOWLORIS": DoS
      "DOS SLOWHTTPTEST": DoS
      "HEARTBLEED": Heartbleed
      "DDOS": DDoS
      "PORTSCAN": PortScan
      "FTP-PATATOR": BruteForce
      "SSH-PATATOR": BruteForce
      "WEB ATTACK - BRUTE FORCE": Web
      "WEB ATTACK - XSS": Web
      "WEB ATTACK - SQL INJECTION": Web
      "INFILTRATION": Infiltration
      "BOT": Bot

  cse_cic_ids2018:
    label_column_candidates: ["Label"]
    benign_labels: ["BENIGN"]
    family_map:
      "BENIGN": Other       # guard: a benign label must never appear as an attack key
      "DOS ATTACKS-HULK": DoS
      "DOS ATTACKS-SLOWHTTPTEST": DoS
      "DOS ATTACKS-GOLDENEYE": DoS
      "DOS ATTACKS-SLOWLORIS": DoS
      "DDOS ATTACK-HOIC": DDoS
      "DDOS ATTACK-LOIC-UDP": DDoS
      "DDOS ATTACKS-LOIC-HTTP": DDoS
      "BRUTE FORCE -WEB": Web
      "BRUTE FORCE -XSS": Web
      "SQL INJECTION": Web
      "INFILTERATION": Infiltration
      "BOT": Bot
      "FTP-BRUTEFORCE": BruteForce
      "SSH-BRUTEFORCE": BruteForce

  unsw_nb15:
    label_column_candidates: ["attack_cat", "label", "Label"]
    # UNSW-NB15 carries a numeric label plus a categorical attack_cat.
    attack_category_column: "attack_cat"
    benign_labels: ["NORMAL", "BENIGN", "0"]
    family_map:
      "GENERIC": Generic
      "EXPLOITS": Exploits
      "FUZZERS": Fuzzers
      "DOS": DoS
      "RECONNAISSANCE": Reconnaissance
      "ANALYSIS": Analysis
      "BACKDOOR": Backdoor
      "SHELLCODE": Shellcode
      "WORMS": Worms

rejection_accounting:
  required_fields: [dataset, original_label, normalized_label, row_count, percentage, reason]
  output: results/audits/label_rejections.csv
