# Temporal holdout validation for CSE-CIC-IDS2018 (R10 Contract)
# XRL-IDARS Phase 1 - GAP-P06 closure
#
# This run deliberately does NOT use the row-level stratified split. Rows are
# ordered by the real capture `Timestamp` and cut into contiguous train /
# validation / test blocks. The test block is strictly later than validation,
# and validation is strictly later than training. Class stratification is not
# applied; the observed class distribution is reported as part of the evidence.

experiment:
  id: EXP-P1-CSE2018-TEMPORAL-R10-001
  phase: 1
  research_question: RQ1_RQ2_RQ3_TEMPORAL_VALIDATION
  hypothesis: >
    A strictly time-ordered held-out test period measures future-day generalisation
    and quantifies how much of the row-level random-split performance is attributable
    to near-duplicate temporal leakage.
  status: ready_for_execution

dataset:
  key: cse_cic_ids2018
  files: all_verified
  require_verified_checksums: true
  require_schema_validated: true

label_contract:
  path: configs/labels/label_mapping.yaml
  require_status: candidate_frozen
  unknown_label_policy: REJECT

features:
  registry: configs/features/features.yaml
  rung: R10
  require_frozen: true

cleaning:
  drop_exact_duplicates: true
  drop_negative_duration: true
  accounting_required: true

split:
  methodology: temporal
  duplicate_policy: deduplicate_features
  duplicate_conflict_policy: reject_conflicts
  train: 0.6
  validation: 0.2
  test: 0.2
  seed: 42
  seeds: [42]
  stratify: false
  time_column: timestamp
  time_fallback_group_column: source_file
  leakage_audit_required: true
  fail_on_leakage: true

preprocessing:
  scaler: StandardScaler
  imputation: median_train
  fit_on: train_only

models:
  random_forest:
    n_estimators: 100
    max_depth: 16
    min_samples_leaf: 2
    class_weight: balanced_subsample
    random_state: 42
    n_jobs: -1
  # The LSTM is intentionally not trained for this validation run. It is an
  # offline sequence model whose windows are built within each split; the
  # temporal-split question is answered by the tabular RF comparison first.
  lstm:
    seq_len: 5
    stride: 1
    label_rule: last
    hidden_size: 32
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 256
    epochs: 15
    patience: 3
    seed: 42
  fusion:
    alpha: null
    alignment: inner
    tune_metric: roc_auc

calibration:
  method: platt
  fit_on: validation
  report: [brier, ece, reliability_curve]

thresholding:
  sweep: [0.0, 1.0, 0.01]
  population: validation
  objective: null
  decision_id: D-003

evaluation:
  metrics: [accuracy, precision, recall, f1, macro_f1, weighted_f1, balanced_accuracy,
            specificity, fpr, fnr, roc_auc, pr_auc]
  confusion_matrix_required: true
  report_population: aligned_intersection

explainability:
  shap:
    enabled: false
    method: tree_shap
    max_background: 100
    max_explain: 200

outputs:
  results_dir: results/experiments/EXP-P1-CSE2018-TEMPORAL-R10-001
  save_models: true
  save_predictions: true
