# Cross-dataset transfer experiment: CSE-CIC-IDS2018 (source) -> UNSW-NB15 (target)
# XRL-IDARS Phase 1 (repo: fyp-xrlids)

experiment:
  id: EXP-P1-TRANSFER-CSE-TO-UNSW-001
  phase: 1
  research_question: RQ5
  hypothesis: >
    Models trained on CSE-CIC-IDS2018 using the common transfer feature contract
    can be evaluated on UNSW-NB15 to test cross-dataset generalisation without feature fabrication.
  status: ready_for_execution

source_dataset:
  key: cse_cic_ids2018
  file: Thursday-01-03-2018_TrafficForML_CICFlowMeter.csv

target_dataset:
  key: unsw_nb15

features:
  mode: programmatic_common_transfer_contract
  base_rung: R10

split:
  methodology: stratified_random
  duplicate_policy: deduplicate_features
  train: 0.6
  validation: 0.2
  test: 0.2
  seed: 42

preprocessing:
  scaler: StandardScaler
  fit_on: source_train_only  # Target data NEVER fits the preprocessor

models:
  random_forest:
    n_estimators: 100
    max_depth: 16
    min_samples_leaf: 2
    class_weight: balanced_subsample
    random_state: 42
    n_jobs: -1

outputs:
  results_dir: results/experiments/EXP-P1-TRANSFER-CSE-TO-UNSW-001
