# Phase 2A Deterministic Autonomous Response Baseline Ladder Benchmark
# XRL-IDARS Phase 2A (SPEC-P2-AUTONOMOUS-RESPONSE-001)

experiment:
  id: EXP-P2A-BASELINES-001
  phase: "2A"
  research_question: RQ7_RQ8_RQ9
  description: >
    Phase 2A deterministic baseline response ladder evaluation under research cost regimes
    and non-bypassable safety gates on the designated policy-development validation population.
  status: ready_for_execution

parent_experiment:
  id: EXP-P1-CIC2017-R10-001
  dataset: cicids2017
  feature_contract: R10
  model_type: RandomForestDetector
  score_type: tree_vote_fraction

population_isolation:
  dataset: cicids2017
  phase1_validation_total_rows: 355864
  d_pol_train_fraction: 0.60
  d_pol_val_fraction: 0.40
  d_pol_test_untouched_rows: 355865
  seed: 42

safety_gate:
  action_cooldown_steps: 30
  blast_radius_threshold: 0.05
  critical_hosts:
    - host_gateway
    - host_dns
    - 10.0.0.1
    - 10.0.0.2
    - host_0
    - host_1

baselines:
  - id: baseline_0
    name: Baseline_0_Always_ALLOW
    description: "Zero automated intervention (ALLOW all)"
  - id: baseline_1
    name: Baseline_1_Single_Threshold
    threshold: 0.50
    description: "Binary threshold at research boundary 0.50 (experimental comparator)"
  - id: baseline_2
    name: Baseline_2_Two_Tier_Threshold
    tau_suspect: 0.40
    tau_isolate: 0.75
    description: "Graded two-tier threshold (0.40 suspect -> rate limit, 0.75 isolate)"
  - id: baseline_3
    name: Baseline_3_Heuristic_State_Machine
    description: "Rule-based state machine tracking suspicion history, escalation, and cooldown"

cost_regimes:
  - standard_enterprise
  - high_availability
  - high_security_enclave

action_modes:
  - 4-action
  - 3-action

evaluation:
  n_bootstraps: 1000
  seed: 42
  metrics:
    - cumulative_operational_cost
    - mean_cost_per_flow
    - false_quarantine_rate
    - business_availability_score_pct
    - action_chattering_index
    - mitigation_delay_steps
    - relative_cost_reduction_pct
