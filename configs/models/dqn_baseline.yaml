# DQN Response Policy - XRL-IDARS v1 (repo: fyp-xrlids)
#
# The DQN is a RESPONSE POLICY, not the detector. It maps detector state to an action.
# The historical reward function below is a HYPOTHESIS to test, not a universal truth (§51).

model_id_prefix: "<DATASET>-<RUNG>-DQN"
type: DQN
status: historical_starter

# NOTE (Phase 2 Evolution):
# This file records the historical starter scaffold. The canonical implemented policy
# (SPEC-P2-AUTONOMOUS-RESPONSE-001, configs/experiments/p2b_cicids2017_dqn.yaml) utilizes a
# 6-dimensional causal state vector in R^6: s_t = [S_t, ΔS_t, N_alert, a_(t-1), c_t, v_t]
# derived strictly from RF detector output, flow rate, and historical decision buffers.

state:
  components:
    - rf_probability
    - lstm_score
    - fusion_score
  normalization: null       # historical starter scaffold; see xrlids.response.state for 6D causal state
  extra_features: []

actions:
  - id: 0
    name: ALLOW
  - id: 1
    name: ALERT
  - id: 2
    name: BLOCK

# ---------------------------------------------------------------------------
# Reward — historical configuration, TO BE TESTED via sensitivity study (§51)
# ---------------------------------------------------------------------------
reward:
  status: hypothesis_not_truth
  historical:
    benign:
      ALLOW: 1
      ALERT: -2
      BLOCK: -10
    attack:
      ALLOW: -50
      ALERT: -5
      BLOCK: 10
  sensitivity_study:
    configurations:
      A: standard_enterprise      # Balanced baseline regime (Benign Isolate: 60.0, Attack Allow: 100.0)
      B: high_availability        # Availability prioritized (Benign Isolate: 120.0, Attack Allow: 50.0)
      C: high_security_enclave    # Breach prevention prioritized (Benign Isolate: 25.0, Attack Allow: 500.0)
    compare:
      - attack_protection
      - false_blocking
      - expected_reward
      - action_distribution

training:
  seeds: []
  episodes: null
  exploration: null
  replay_buffer: null
  target_update: null
  gamma: null
  learning_rate: null

baselines_required:          # §52 — DQN must be compared, not trusted
  - Always-ALLOW
  - Always-BLOCK
  - Fixed-threshold policy
  - RF policy
  - Fusion policy

stability_checks:            # §50
  - policy_stability
  - reward_sensitivity
  - threshold_sensitivity
  - seed_sensitivity
  - state_distribution

safety:
  policy_config: configs/safety/response_safety_policy.yaml
  note: "DQN output is a recommendation. The safety layer may downgrade it. DQN never writes firewall rules."
