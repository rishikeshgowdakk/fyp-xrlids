# LSTM Baseline - XRL-IDARS v1 (repo: fyp-xrlids)
#
# The LSTM is a SUPERVISED temporal classifier over sequences of flow vectors (not generative).
# Historical hyperparameters are a STARTING POINT, not a result (§26).

model_id_prefix: "<DATASET>-<RUNG>-LSTM"
type: SupervisedLSTM
status: historical_starter

sequence:
  T: 5                    # sequence length: number of consecutive flow vectors
  construction: sliding_window  # consecutive file-order flow sequence (stride 1)
  ordering_key: file_arrival_order
  grouping_key: split_isolated  # sequences strictly isolated within train/val/test splits
  label_rule: last              # label of the sequence is the target label of the last flow
  boundary_handling: no_cross_split   # MANDATORY: no sequence may cross train/val/test
  padding: none

hyperparameters:
  hidden_size: 32
  num_layers: 2
  dropout: 0.2
  optimizer: Adam
  learning_rate: 0.001
  loss: BCEWithLogitsLoss
  batch_size: 256
  epochs: 15
  early_stopping: patience_3
  best_checkpoint_criterion: val_loss

training:
  seeds: []               # record all seeds used
  hardware: null
  time_HH_MM: null

critical_checks:
  - id: CHK-LSTM-01
    description: "Train/validation/test sequence boundaries do not overlap (§27)."
    fail_action: "STOP -> FIX SPLITTING -> REGENERATE SEQUENCES -> DOCUMENT FAILURE"
    status: not_run

notes:
  - "Sequence construction must be defined before any LSTM run; an undefined ordering makes results unreproducible."
