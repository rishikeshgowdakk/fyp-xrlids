name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt || pip install -e .[dev]

      - name: Verify Environment and Model Checkpoints
        run: |
          python -c "import torch, sklearn, shap; print('Dependencies loaded successfully.')"
          python -c "from scripts.phase2.run_phase2b_readiness_audit import check_working_tree_clean; print('Working-tree audit script callable.')"

      - name: Run Core Test Suite (Tiers 1, 2, 3)
        run: |
          pytest tests/ -v -ra --tb=short
