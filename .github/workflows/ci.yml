name: CI

on:
  push:
    branches: [main, "engineering/**", "pre-xgboost-replay-lab"]
  pull_request:
    branches: [main, "engineering/**"]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e .[dev]

      - name: Verify Environment and Model Checkpoints
        run: |
          python -c "import xrlids, torch, sklearn, shap, xgboost; from xrlids.models.xgboost_detector import XGBoostDetector; print(f'xrlids and dependencies loaded; XGBoost {xgboost.__version__}; detector import OK.')"
          python -c "from scripts.phase2.run_phase2b_readiness_audit import check_working_tree_clean; print('Working-tree audit script callable.')"

      - name: Run Core Test Suite (Tiers 1, 2, 3)
        run: |
          pytest tests/ -v -ra --tb=short
