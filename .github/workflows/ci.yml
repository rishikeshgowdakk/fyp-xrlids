name: CI

on:
  push:
    branches: [main, "engineering/**", "pre-xgboost-replay-lab"]
  pull_request:
    branches: [main, "engineering/**"]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xrlids
          POSTGRES_USER: xrlids_user
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U xrlids_user -d xrlids"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e .[dev,dashboard]

      - name: Verify Environment and Model Checkpoints
        run: |
          python -c "import xrlids, torch, sklearn, shap, xgboost, streamlit; from xrlids.models.xgboost_detector import XGBoostDetector; print(f'xrlids and dependencies loaded; XGBoost {xgboost.__version__}; Streamlit {streamlit.__version__}; detector import OK.')"
          python -c "from scripts.phase2.run_phase2b_readiness_audit import check_working_tree_clean; print('Working-tree audit script callable.')"

      - name: Run Core Test Suite (Tiers 1, 2, 3)
        run: |
          pytest tests/ -v -ra --tb=short
