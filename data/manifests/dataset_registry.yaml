    and metadata only, never the data itself.

    '
  description: 'Five days of attack-free and attack traffic (Monday benign; Tuesday
    BruteForce/FTP, SSH-Patator; Wednesday DoS attacks incl. Heartbleed; Thursday
    Web attacks, Infiltration, PortScan; Friday Botnet, PortScan, DDoS). Flow features
    generated by CICFlowMeter, one machine CSV per capture day.

    '
  provenance_class: third_party_mirror
  acquisition_status: verified
  acquisition_note: 'Primary mirror iscxdownloads.cs.unb.ca is unreachable from this
    network (NXDOMAIN, checked 2026-09-30). Download the GeneratedLabelledFlows CSVs
    manually from the official page or an authorised mirror, then register each file:
    python scripts/phase1/prepare_dataset.py register --dataset cicids2017 --file
    <csv>

    '
