  schema_status: validated
  label_status: validated
  audit_status: completed
  known_limitations:
  - Different feature-derivation pipeline (Argus/Bro) from the CIC datasets.
  - No TCP flag counts, no IAT statistics, no active/idle, no subflow fields in the
    CSV distribution.
  - label column is 0/1 integer; attack_cat carries the category. Taxonomy wholly
    different from CIC.
  notes: 'Third domain for RQ5. Cannot satisfy the current R10 contract (4/10 features
    supported) - recorded in FEATURE_COMPATIBILITY.md; decision pending.

    '
local_layout:
  raw_root: data/raw
  per_dataset:
    cicids2017: data/raw/cicids2017/
    cse_cic_ids2018: data/raw/cse_cic_ids2018/
    unsw_nb15: data/raw/unsw_nb15/
cross_dataset_constraints:
  merge_policy: forbid
  merge_rationale: 'Different collection environments, schemas, feature derivations,
    attack taxonomies and distributions make naive pooling scientifically meaningless.
    Cross-dataset work is done via explicit transfer experiments.

    '
  transfer_directions_required:
  - cicids2017 -> cse_cic_ids2018
  - cicids2017 -> unsw_nb15
  - cse_cic_ids2018 -> cicids2017
  - cse_cic_ids2018 -> unsw_nb15
  - unsw_nb15 -> cicids2017
  - unsw_nb15 -> cse_cic_ids2018
  normalization_decision: D-005
