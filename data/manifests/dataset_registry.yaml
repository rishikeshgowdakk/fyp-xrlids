- key: unsw_nb15
  name: UNSW-NB15
  version: as-published-2015 (train/test CSV split)
  source: UNSW Canberra Cyber, Australian Centre for Cyber Security
  source_url: https://research.unsw.edu.au/projects/unsw-nb15-dataset
  license: 'Publicly released for research use by UNSW Canberra. Confirm terms on
    the official page. This repository stores checksums and metadata only.

    '
  description: 'Hybrid real normal + synthetic attack traffic (nine attack families)
    captured on the IXIA PerfectStorm testbed. Flow features from Argus, Bro-IDS and
    twelve developed tools. The CSV distribution used here: a 175,341-row training
    set and an 82,332-row testing set (published partition), plus ground-truth/list-events
    files.

    '
  provenance_class: recognized_mirror
  acquisition_status: verified
  acquisition_note: 'Distributed via UNSW''s official page (historically a share-link)
    and mirrors. Register the CSV files after manual download. Packet captures (pcap)
    are NOT required for Phase 1.

    '
  expected_files:
  - file: UNSW_NB15_training-set.csv
    note: published train partition (reference count 175341 rows)
  - file: UNSW_NB15_testing-set.csv
    note: published test partition (reference count 82332 rows)
  - file: UNSW-NB15_LIST_EVENTS.csv
    note: event list; metadata only, not a modelling input
  expected_files_note: 'Row counts above are the published reference figures recorded
    for later verification, NOT audit results. The audit must confirm them.

    '
