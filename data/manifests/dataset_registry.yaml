# Dataset Registry - XRL-IDARS v1 (repo: fyp-xrlids)
#
# This file is the AUTHORITATIVE machine-readable provenance record.
#
# RULES (build spec sections 5-7, 25, 27):
#   - sha256 values are ONLY written after being computed from the actual file
#     (scripts/phase1/prepare_dataset.py register). Never hand-entered.
#   - A file is only 'verified' after a successful re-check of its checksum.
#   - Datasets stay SEPARATE. Pooling rows across datasets is forbidden; cross-dataset
#     work is transfer experiments only.
#   - acquisition_status values:
#       not_acquired | partial | available | verified | failed
#   - file status values:
#       expected (declared, absent) | registered (checksummed once) | verified | mismatch
#   - schema_status / label_status / audit_status values:
#       not_run | unknown | validated | failed
#
# CHECKED 2026-09-30: the historical primary mirror iscxdownloads.cs.unb.ca does not
# resolve from this network (DNS NXDOMAIN). This is an environmental constraint, not a
# provenance claim about the mirror itself. Acquisition therefore requires manual
# download via the official pages below (or an authorised mirror), followed by
# registration and verification with scripts/phase1/prepare_dataset.py.

registry_version: "0.3.0"
last_updated: "2026-09-30"
overall_acquisition_status: not_acquired

# ---------------------------------------------------------------------------
datasets:

  - key: cicids2017
    name: CIC-IDS2017
    version: "as-published-2017"
    source: "Canadian Institute for Cybersecurity (CIC), University of New Brunswick"
    source_url: "https://www.unb.ca/cic/datasets/ids-2017.html"
    license: >
      Publicly released for research use by CIC/UNB. Confirm the terms on the official
      dataset page before redistribution. This repository stores checksums and metadata
      only, never the data itself.
    description: >
      Five days of attack-free and attack traffic (Monday benign; Tuesday BruteForce/FTP,
      SSH-Patator; Wednesday DoS attacks incl. Heartbleed; Thursday Web attacks,
      Infiltration, PortScan; Friday Botnet, PortScan, DDoS). Flow features generated by
      CICFlowMeter, one machine CSV per capture day.
    acquisition_status: not_acquired
    acquisition_note: >
      Primary mirror iscxdownloads.cs.unb.ca is unreachable from this network
      (NXDOMAIN, checked 2026-09-30). Download the GeneratedLabelledFlows CSVs manually
      from the official page or an authorised mirror, then register each file:
      python scripts/phase1/prepare_dataset.py register --dataset cicids2017 --file <csv>
    expected_files:
      # CICFlowMeter GeneratedLabelledFlows CSVs (machine CSVs used for modelling)
      - {file: Monday-WorkingHours.pcap_ISCX.csv,            note: benign-only day}
      - {file: Tuesday-WorkingHours.pcap_ISCX.csv,           note: FTP/SSH Patator}
      - {file: Wednesday-workingHours.pcap_ISCX.csv,         note: DoS family + Heartbleed}
      - {file: Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv}
      - {file: Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv}
      - {file: Thursday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv}
      - {file: Friday-WorkingHours-Morning.pcap_ISCX.csv}
      - {file: Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv}
      - {file: Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv}
    expected_files_note: >
      File names are as published by CIC. Some mirrors rename files; if a mirror's names
      differ, register them anyway and record the difference in notes - the audit will
      still validate schemas and labels per file. Do not silently accept renamed files
      as the same content.
    files: []
    schema_status: not_run
    label_status: not_run
    audit_status: not_run
    known_limitations:
      - "Historical audit reported substantial duplicate rows and a label-header artifact; MUST be re-verified by the audit, not assumed."
      - "Label column historically contains leading/trailing spaces and unicode dashes."
    notes: "Primary in-domain benchmark."

  - key: cse_cic_ids2018
    name: CSE-CIC-IDS2018
    version: "as-published-2018"
    source: "Communications Security Establishment (CSE) and CIC, University of New Brunswick"
    source_url: "https://www.unb.ca/cic/datasets/ids-2018.html"
    license: >
      Publicly released for research use (CSE-CIC partnership; also distributed via the
      AWS Registry of Open Data). Confirm terms on the official page.
    description: >
      Ten days of traffic with Brute Force, Heartbleed, Botnet, DoS, DDoS, Web attacks
      and Infiltration. CICFlowMeter flow features, one CSV per capture day. Column
      naming differs from 2017 (e.g. 'Tot Fwd Pkts' vs 'Total Fwd Packets').
    acquisition_status: not_acquired
    acquisition_note: >
      Historically distributed via an AWS S3 bucket (registry of open data) and the CIC
      site. From this network neither host resolved (checked 2026-09-30). Download the
      day CSVs manually, then register each file. This is the largest dataset of the
      three; confirm available disk before starting.
    expected_files:
      # Day CSVs as commonly distributed. Naming varies across mirrors; the audit
      # validates schemas per file regardless of filename.
      - {file: Wednesday-14-02-2018_TrafficForML_CICFlowMeter.csv}
      - {file: Thursday-15-02-2018_TrafficForML_CICFlowMeter.csv}
      - {file: Thursday-15-02-2018_TrafficForML_CICFlowMeter_1.csv}
      - {file: Thursday-22-02-2018_TrafficForML_CICFlowMeter.csv}
      - {file: Friday-16-02-2018_TrafficForML_CICFlowMeter.csv}
      - {file: Friday-23-02-2018_TrafficForML_CICFlowMeter.csv}
      - {file: Thursday-01-03-2018_TrafficForML_CICFlowMeter.csv}
      - {file: Friday-02-03-2018_TrafficForML_CICFlowMeter.csv}
    expected_files_note: >
      The 2018 distribution has heterogeneous per-file schemas historically. Every
      registered file gets an independent schema audit; no file is assumed to match
      another. Mirror sets vary - register what was actually obtained and record the
      source in the file entry.
    files: []
    schema_status: not_run
    label_status: not_run
    audit_status: not_run
    known_limitations:
      - "Historical audit reported heterogeneous per-file schemas; to be established per file."
      - "Some distributions contain duplicate/near-duplicate day files with inconsistent labels."
    notes: "Provides the second domain for cross-dataset transfer (RQ5)."

  - key: unsw_nb15
    name: UNSW-NB15
    version: "as-published-2015 (train/test CSV split)"
    source: "UNSW Canberra Cyber, Australian Centre for Cyber Security"
    source_url: "https://research.unsw.edu.au/projects/unsw-nb15-dataset"
    license: >
      Publicly released for research use by UNSW Canberra. Confirm terms on the official
      page. This repository stores checksums and metadata only.
    description: >
      Hybrid real normal + synthetic attack traffic (nine attack families) captured on
      the IXIA PerfectStorm testbed. Flow features from Argus, Bro-IDS and twelve
      developed tools. The CSV distribution used here: a 175,341-row testing set and an
      82,332-row training set (published partition), plus ground-truth/list-events files.
    acquisition_status: not_acquired
    acquisition_note: >
      Distributed via UNSW's official page (historically a share-link) and mirrors.
      Register the CSV files after manual download. Packet captures (pcap) are NOT
      required for Phase 1.
    expected_files:
      - {file: UNSW_NB15_testing-set.csv,  note: "published test partition (reference count 175341 rows)"}
      - {file: UNSW_NB15_training-set.csv, note: "published train partition (reference count 82332 rows)"}
      - {file: UNSW-NB15_LIST_EVENTS.csv,  note: "event list; metadata only, not a modelling input"}
    expected_files_note: >
      Row counts above are the published reference figures recorded for later
      verification, NOT audit results. The audit must confirm them.
    files: []
    schema_status: not_run
    label_status: not_run
    audit_status: not_run
    known_limitations:
      - "Different feature-derivation pipeline (Argus/Bro) from the CIC datasets."
      - "No TCP flag counts, no IAT statistics, no active/idle, no subflow fields in the CSV distribution."
      - "label column is 0/1 integer; attack_cat carries the category. Taxonomy wholly different from CIC."
    notes: >
      Third domain for RQ5. Cannot satisfy the current R10 contract (4/10 features
      supported) - recorded in FEATURE_COMPATIBILITY.md; decision pending.

# ---------------------------------------------------------------------------
# Local layout (gitignored; data never committed)
# ---------------------------------------------------------------------------
local_layout:
  raw_root: data/raw
  per_dataset:
    cicids2017: data/raw/cicids2017/
    cse_cic_ids2018: data/raw/cse_cic_ids2018/
    unsw_nb15: data/raw/unsw_nb15/

# ---------------------------------------------------------------------------
# Cross-dataset constraints (unchanged)
# ---------------------------------------------------------------------------
cross_dataset_constraints:
  merge_policy: forbid
  merge_rationale: >
    Different collection environments, schemas, feature derivations, attack taxonomies
    and distributions make naive pooling scientifically meaningless. Cross-dataset work
    is done via explicit transfer experiments.
  transfer_directions_required:
    - cicids2017 -> cse_cic_ids2018
    - cicids2017 -> unsw_nb15
    - cse_cic_ids2018 -> cicids2017
    - cse_cic_ids2018 -> unsw_nb15
    - unsw_nb15 -> cicids2017
    - unsw_nb15 -> cse_cic_ids2018
  normalization_decision: D-005   # OPEN
