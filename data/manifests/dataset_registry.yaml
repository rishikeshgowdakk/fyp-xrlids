# Dataset Registry - XRL-IDARS v1 (repo: fyp-xrlids)
#
# RULES (§10, §11):
#   - Datasets are kept SEPARATE. Never blindly merged.
#   - SHA256 is recorded per file AFTER download.
#   - If a downloaded file's SHA256 differs from what is recorded here, the pipeline
#     MUST report a mismatch and stop. Never silently replace data.
#   - Historical findings (e.g. duplicate rows in CICIDS2017) are HYPOTHESES to re-check,
#     not numbers to copy.
#
# Status values per file: pending | verified | mismatch
# This file is the single source of truth for dataset provenance.

registry_version: "0.1.0"
last_updated: "2026-09-30"
acquisition_status: not_started   # not_started | in_progress | complete   (blocked by D-004)

# ---------------------------------------------------------------------------
# Schema reminder — every file entry must eventually carry all of:
#   path, size_bytes, sha256, rows, columns, label_column
# and every dataset entry all of:
#   name, full_name, source, url, download_date, version, license,
#   known_limitations, notes
# ---------------------------------------------------------------------------

datasets:

  - key: cicids2017
    name: CICIDS2017
    full_name: "Canadian Institute for Cybersecurity Intrusion Detection System 2017"
    source: "Canadian Institute for Cybersecurity (CIC), University of New Brunswick"
    url: null                 # TODO: record exact URL used at download time
    mirror: null
    download_date: null
    version: null             # record as published/verified, e.g. "as-published-2017"
    license: null             # TODO: record dataset terms of use
    label_column: null        # historically "Label"; to be confirmed by audit, not assumed
    files: []                 # TODO: one entry per CSV with sha256 + row/column counts
    known_limitations:
      - "Historical audit reported substantial duplicate rows and a label-header artifact; these must be RE-CHECKED by scripts/phase1/01_dataset_audit.py, not assumed."
      - "Contains attack categories that do not appear in the other two datasets."
    notes: "Primary in-domain benchmark. Historically also the source side of several transfer experiments."

  - key: cse_cic_ids2018
    name: CSE-CIC-IDS2018
    full_name: "Communications Security Establishment / Canadian Institute for Cybersecurity IDS 2018"
    source: "CSE and CIC, University of New Brunswick"
    url: null
    mirror: null
    download_date: null
    version: null
    license: null
    label_column: null
    files: []
    known_limitations:
      - "Historical audit reported heterogeneous per-file schemas; the audit must establish the true per-file column sets."
      - "Large; acquisition cost is the main reason D-004 is open."
    notes: "AWS-collected. Feature names partially overlap CICIDS2017 but must not be assumed identical."

  - key: unsw_nb15
    name: UNSW-NB15
    full_name: "UNSW-NB15 Network Intrusion Dataset"
    source: "UNSW Canberra (Australian Centre for Cyber Security)"
    url: null
    mirror: null
    download_date: null
    version: null
    license: null
    label_column: null
    files: []
    known_limitations:
      - "Different feature derivation pipeline (Argus/Bro-based) from the CIC datasets."
      - "Attack taxonomy differs; label equivalence must be justified, not assumed."
    notes: "Third dataset, provides a genuinely different domain for RQ5."

# ---------------------------------------------------------------------------
# Cross-dataset constraints (registered now, enforced later)
# ---------------------------------------------------------------------------
cross_dataset_constraints:
  merge_policy: forbid          # naive merging of the three datasets is forbidden
  merge_rationale: >
    Schema, feature-definition, label-taxonomy and distribution differences mean a naive
    merge would produce a scientifically meaningless benchmark. Cross-dataset work is done
    via explicit transfer experiments (six directions), not by pooling rows.
  transfer_directions_required:
    - cicids2017 -> cse_cic_ids2018
    - cicids2017 -> unsw_nb15
    - cse_cic_ids2018 -> cicids2017
    - cse_cic_ids2018 -> unsw_nb15
    - unsw_nb15 -> cicids2017
    - unsw_nb15 -> cse_cic_ids2018
  normalization_decision: D-005   # OPEN — see docs/03_DECISIONS/DECISION_LOG.md
